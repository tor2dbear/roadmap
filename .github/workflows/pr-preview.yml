name: PR checks + preview

# A real gate on pull requests (the deploy job in sync.yml only runs on push to
# main). Two things:
#   1. CHECK  — syntax-check the board JS and build data/ with the harvester, so a
#      broken app.js or a harvest failure turns the PR red before merge.
#   2. PREVIEW — upload a Cloudflare Worker *version* (not a deploy) so the branch
#      gets its own preview URL without touching prod (roadmap.tor2dbear.com stays
#      on main's active version). The URL is posted as a sticky PR comment.
#
# Reuses the same secrets as sync.yml (CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID).
# The preview step is gated on those creds, so a fork PR (no secrets) still runs the
# checks and just skips the preview instead of failing.

on:
  pull_request:
    branches: [main]
  # The manual escape hatch the other two workflows already had. A run can fail to
  # start on GitHub's side (`startup_failure` seconds in, with the file unchanged) and
  # the push after it can produce no run at all — and then the preview URL silently
  # keeps serving an older commit, which is worse than a red check because it looks
  # fine. Without a dispatch the only way back was another push, i.e. a commit whose
  # whole purpose is to kick CI.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to check and preview"
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  check-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the harvester can derive puck created-dates
          # On `pull_request` the empty ref is the merge commit GitHub already prepared;
          # a manual run has no such context and has to name it.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || '' }}

      # Both triggers have to answer "which PR, and who wrote it" the same way: the
      # event carries it, a manual run has to look it up.
      - name: Resolve the PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.pull_request.number || inputs.pr }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          author="$AUTHOR"
          [ -n "$author" ] || author=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUM" --jq .user.login)
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"
          echo "PR #$NUM by @$author"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci || npm install

      - name: Syntax-check the JS (board + scripts)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in app.js scripts/*.mjs scripts/lib/*.mjs; do
            node --check "$f" && echo "ok: $f"
          done

      # Cached on the Playwright version, so a run that changes nothing about the browser
      # restores in a few seconds instead of pulling ~100 MB again.
      - name: Resolve the Playwright version
        id: pw
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the browser
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}

      - name: Install the browser
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium-headless-shell

      # The system libraries are not in the cache — only the browser is — so they are
      # (re)installed on a hit too. It is a no-op when they are already present.
      - name: Ensure browser system libraries
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium-headless-shell

      # The board's own behaviour, against a synthetic payload — deliberately before the
      # harvest below, which rewrites `data/` and would otherwise be what the tests read.
      - name: Test the board
        run: npm test

      - name: Clone source repos (treeless, read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          repos=$(node -e "for (const s of require('./sources.json').sources) console.log(s.repo, s.branch || require('./sources.json').defaultBranch || 'main')")
          while read -r repo branch; do
            [ -z "$repo" ] && continue
            # This repo is a source of itself: point the harvester at the PR checkout
            # (the proposed changes), not a fresh clone of main, so the gate validates
            # and the preview renders the PR's own roadmap/*.md.
            if [ "$repo" = "$SELF_REPO" ]; then
              echo "Linking $repo → PR checkout ($GITHUB_WORKSPACE)"
              mkdir -p "$RUNNER_TEMP/sources/$(dirname "$repo")"
              ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/sources/$repo"
              continue
            fi
            echo "Cloning $repo@$branch"
            git clone --filter=blob:none --branch "$branch" \
              "https://github.com/$repo" "$RUNNER_TEMP/sources/$repo" \
              || git clone --filter=blob:none "https://github.com/$repo" "$RUNNER_TEMP/sources/$repo"
          done <<< "$repos"

      - name: Harvest (build data/ fresh — the build gate)
        env:
          ROADMAP_LOCAL_ROOT: ${{ runner.temp }}/sources
        run: node scripts/harvest.mjs

      - name: Validate the generated payload
        run: |
          node -e "
          const d = require('./data/roadmap.json');
          if (!Array.isArray(d.items) || !d.items.length) throw new Error('roadmap.json has no items');
          // The harvester records per-source failures instead of throwing, so a PR that
          // breaks a source (e.g. an unknown adapter) would still exit 0 and silently drop
          // it. Fail the gate so the source markdown stays authoritative.
          const bad = (d.sources || []).filter(s => s && s.error);
          if (bad.length) throw new Error('source(s) failed to harvest: ' + bad.map(s => s.repo + ' — ' + s.error).join('; '));
          console.log('✓ items:', d.items.length, '· sources ok:', (d.sources || []).length);
          "

      # Gate the credentialed preview: secrets exist only on same-repo PRs, and the job
      # runs PR-controlled package.json + wrangler. Restrict it to PRs authored by the
      # repo owner so a branch pusher without Cloudflare access can't swap the wrangler
      # dependency to read the token. (Secrets can't be used directly in `if:`.)
      - name: Gate the credentialed preview
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IS_OWNER: ${{ steps.pr.outputs.author == github.repository_owner }}
        run: |
          if [ -n "$TOKEN" ] && [ "$IS_OWNER" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            [ "$IS_OWNER" = "true" ] || echo "::notice::Preview skipped — credentialed deploy only runs on owner PRs (checks still ran)."
          fi

      # `npm test` ran before the harvest above, and the harvest writes into the tree —
      # so the bundle this step uploads is not the one that was checked. A preview alias
      # is publicly reachable, so a stray file is published there like anywhere else.
      - name: Guard the bundle (nothing unintended gets served)
        run: node scripts/check-bundle.mjs

      - name: Upload preview version (no prod impact)
        id: preview
        if: steps.cf.outputs.ok == 'true'
        continue-on-error: true # preview is a bonus; the checks above are the gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # A named preview alias gives one *stable* URL per PR that just re-points at
          # the newest version on every push — so the sticky comment link stays the
          # same and can be bookmarked, instead of a fresh per-version hash each time.
          alias="pr-$PR"
          # The log goes to RUNNER_TEMP, not the repo root. The root *is* the assets
          # directory, and `tee` creates its file the moment the pipeline starts —
          # before wrangler walks the tree — so a log written here was uploaded and
          # served. It was: /wrangler-out.txt answered 200 on the preview, publishing
          # the runner's absolute path and the whole asset list. check-bundle.mjs
          # cannot catch this class, because the file does not exist when it runs.
          log="$RUNNER_TEMP/wrangler-out.txt"
          npx wrangler versions upload --preview-alias "$alias" 2>&1 | tee "$log"
          # Prefer the stable alias URL; fall back to the per-version URL if absent.
          url=$(grep -oE "https://${alias}-[^ ]*workers\.dev" "$log" | head -1 || true)
          [ -n "$url" ] || url=$(grep -oE 'https://[^ ]*workers\.dev' "$log" | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Only touch the comment when we actually have a URL, so a transient upload
      # failure (continue-on-error above) can't overwrite the last good stable link.
      - name: Post the preview link as a sticky comment
        if: steps.cf.outputs.ok == 'true' && steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const url = process.env.PREVIEW_URL;
            const body = `${marker}\n### 🔍 Staging preview\n**${url}**\n\nStabil länk för den här PR:en — den pekar om till senaste versionen vid varje push (bokmärk den gärna). Detta är en Worker-*version*; prod (roadmap.tor2dbear.com) påverkas inte förrän du mergar till \`main\`.`;
            const { owner, repo } = context.repo;
            // Not `context.issue.number`: a manual run carries no issue context.
            const issue_number = Number(process.env.PR_NUMBER);
            // Paginate so the marker is found even past the first 30 comments.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
