name: PR checks + preview

# A real gate on pull requests (the deploy job in sync.yml only runs on push to
# main). Two things:
#   1. CHECK  — syntax-check the board JS and build data/ with the harvester, so a
#      broken app.js or a harvest failure turns the PR red before merge.
#   2. PREVIEW — upload a Cloudflare Worker *version* (not a deploy) so the branch
#      gets its own preview URL without touching prod (roadmap.tor2dbear.com stays
#      on main's active version). The URL is posted as a sticky PR comment.
#
# Reuses the same secrets as sync.yml (CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID).
# The preview step is gated on those creds, so a fork PR (no secrets) still runs the
# checks and just skips the preview instead of failing.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the harvester can derive puck created-dates

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci || npm install

      - name: Syntax-check the JS (board + scripts)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in app.js scripts/*.mjs scripts/lib/*.mjs; do
            node --check "$f" && echo "ok: $f"
          done

      - name: Clone source repos (treeless, read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          repos=$(node -e "for (const s of require('./sources.json').sources) console.log(s.repo, s.branch || require('./sources.json').defaultBranch || 'main')")
          while read -r repo branch; do
            [ -z "$repo" ] && continue
            # This repo is a source of itself: point the harvester at the PR checkout
            # (the proposed changes), not a fresh clone of main, so the gate validates
            # and the preview renders the PR's own roadmap/*.md.
            if [ "$repo" = "$SELF_REPO" ]; then
              echo "Linking $repo → PR checkout ($GITHUB_WORKSPACE)"
              mkdir -p "$RUNNER_TEMP/sources/$(dirname "$repo")"
              ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/sources/$repo"
              continue
            fi
            echo "Cloning $repo@$branch"
            git clone --filter=blob:none --branch "$branch" \
              "https://github.com/$repo" "$RUNNER_TEMP/sources/$repo" \
              || git clone --filter=blob:none "https://github.com/$repo" "$RUNNER_TEMP/sources/$repo"
          done <<< "$repos"

      - name: Harvest (build data/ fresh — the build gate)
        env:
          ROADMAP_LOCAL_ROOT: ${{ runner.temp }}/sources
        run: node scripts/harvest.mjs

      - name: Validate the generated payload
        run: |
          node -e "
          const d = require('./data/roadmap.json');
          if (!Array.isArray(d.items) || !d.items.length) throw new Error('roadmap.json has no items');
          // The harvester records per-source failures instead of throwing, so a PR that
          // breaks a source (e.g. an unknown adapter) would still exit 0 and silently drop
          // it. Fail the gate so the source markdown stays authoritative.
          const bad = (d.sources || []).filter(s => s && s.error);
          if (bad.length) throw new Error('source(s) failed to harvest: ' + bad.map(s => s.repo + ' — ' + s.error).join('; '));
          console.log('✓ items:', d.items.length, '· sources ok:', (d.sources || []).length);
          "

      # Gate the credentialed preview: secrets exist only on same-repo PRs, and the job
      # runs PR-controlled package.json + wrangler. Restrict it to PRs authored by the
      # repo owner so a branch pusher without Cloudflare access can't swap the wrangler
      # dependency to read the token. (Secrets can't be used directly in `if:`.)
      - name: Gate the credentialed preview
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IS_OWNER: ${{ github.event.pull_request.user.login == github.repository_owner }}
        run: |
          if [ -n "$TOKEN" ] && [ "$IS_OWNER" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            [ "$IS_OWNER" = "true" ] || echo "::notice::Preview skipped — credentialed deploy only runs on owner PRs (checks still ran)."
          fi

      - name: Upload preview version (no prod impact)
        id: preview
        if: steps.cf.outputs.ok == 'true'
        continue-on-error: true # preview is a bonus; the checks above are the gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # A named preview alias gives one *stable* URL per PR that just re-points at
          # the newest version on every push — so the sticky comment link stays the
          # same and can be bookmarked, instead of a fresh per-version hash each time.
          alias="pr-$PR"
          npx wrangler versions upload --preview-alias "$alias" 2>&1 | tee wrangler-out.txt
          # Prefer the stable alias URL; fall back to the per-version URL if absent.
          url=$(grep -oE "https://${alias}-[^ ]*workers\.dev" wrangler-out.txt | head -1 || true)
          [ -n "$url" ] || url=$(grep -oE 'https://[^ ]*workers\.dev' wrangler-out.txt | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Only touch the comment when we actually have a URL, so a transient upload
      # failure (continue-on-error above) can't overwrite the last good stable link.
      - name: Post the preview link as a sticky comment
        if: steps.cf.outputs.ok == 'true' && steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const url = process.env.PREVIEW_URL;
            const body = `${marker}\n### 🔍 Staging preview\n**${url}**\n\nStabil länk för den här PR:en — den pekar om till senaste versionen vid varje push (bokmärk den gärna). Detta är en Worker-*version*; prod (roadmap.tor2dbear.com) påverkas inte förrän du mergar till \`main\`.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Paginate so the marker is found even past the first 30 comments.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
