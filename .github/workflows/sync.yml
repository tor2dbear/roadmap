name: Sync roadmap

# Harvests every source repo's roadmap into data/roadmap.json + the board, then
# deploys to GitHub Pages. Runs on a schedule (keeps the board in sync without
# touching the source repos), on manual dispatch, and when the aggregator's own
# code changes. It does NOT run on changes to the generated data, so the commit
# it makes below cannot retrigger it.

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the top of the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "scripts/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - ".github/workflows/sync.yml"

permissions:
  contents: write # commit refreshed data back to the repo
  pages: write
  id-token: write

concurrency:
  group: roadmap-sync
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout aggregator
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone source repos (shallow, read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          repos=$(node -e "for (const s of require('./sources.json').sources) console.log(s.repo, s.branch || require('./sources.json').defaultBranch || 'main')")
          while read -r repo branch; do
            [ -z "$repo" ] && continue
            echo "Cloning $repo@$branch"
            git clone --depth 1 --branch "$branch" \
              "https://github.com/$repo" "$RUNNER_TEMP/sources/$repo" \
              || git clone --depth 1 "https://github.com/$repo" "$RUNNER_TEMP/sources/$repo"
          done <<< "$repos"

      - name: Harvest
        env:
          ROADMAP_LOCAL_ROOT: ${{ runner.temp }}/sources
        run: node scripts/harvest.mjs

      - name: Commit refreshed data (if changed)
        run: |
          set -euo pipefail
          git config user.name "roadmap-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roadmap.json data/roadmap.js ROADMAP.md
          if git diff --cached --quiet; then
            echo "No roadmap changes."
          else
            git commit -m "chore: sync roadmap data [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
