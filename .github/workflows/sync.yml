name: Sync roadmap

# Harvests every source repo's roadmap into data/roadmap.json + the board, then
# deploys straight to Cloudflare with `wrangler deploy`. The data is built fresh
# in CI and served from this run — it is NOT committed back to the repo, so there
# are no generated files in git, no idempotency dance, and no [skip ci] traps.
# One job does the whole thing (harvest + deploy), replacing the old two-robot
# split (commit data → Cloudflare Workers Builds picks it up).
#
# Runs on a schedule (keeps the board fresh without touching the source repos),
# on manual dispatch, and when the aggregator's own code or config changes.
#
# Requires two GitHub secrets: CLOUDFLARE_API_TOKEN (an "Edit Cloudflare Workers"
# token scoped to this account + the tor2dbear.com zone) and CLOUDFLARE_ACCOUNT_ID.
# The Worker's own Git build must be disconnected in the Cloudflare dashboard, or
# it would deploy the stale committed data on top of this fresh one.

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the top of the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "board.config.json"
      - "roadmap/**" # this repo's own pucks → deploy on push, no waiting for the hourly run
      - "scripts/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "wrangler.jsonc"
      - ".assetsignore"
      - ".github/workflows/sync.yml"

permissions:
  contents: read

concurrency:
  group: roadmap-sync
  cancel-in-progress: true

jobs:
  harvest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aggregator
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (wrangler)
        run: npm ci || npm install

      - name: Clone source repos (treeless, read-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sources"
          repos=$(node -e "for (const s of require('./sources.json').sources) console.log(s.repo, s.branch || require('./sources.json').defaultBranch || 'main')")
          while read -r repo branch; do
            [ -z "$repo" ] && continue
            echo "Cloning $repo@$branch"
            # --filter=blob:none keeps full commit history (needed to derive each
            # puck's creation date) while fetching file contents on demand, so it
            # stays nearly as light as a shallow clone.
            git clone --filter=blob:none --branch "$branch" \
              "https://github.com/$repo" "$RUNNER_TEMP/sources/$repo" \
              || git clone --filter=blob:none "https://github.com/$repo" "$RUNNER_TEMP/sources/$repo"
          done <<< "$repos"

      - name: Harvest (build data/ fresh, not committed)
        env:
          ROADMAP_LOCAL_ROOT: ${{ runner.temp }}/sources
        run: node scripts/harvest.mjs

      # Gate the deploy on credentials so a fresh clone / the etapp template (which
      # ships this same workflow but no Cloudflare secrets) harvests green and just
      # skips deploy, instead of failing every run.
      - name: Check for Cloudflare credentials
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set — data/ harvested but not deployed. Add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID to deploy your board."
          fi

      # The served bundle is the repo root, so what wrangler uploads is decided by
      # `.assetsignore` — an exclusion list, which fails silently in the one direction
      # that matters: a file nobody thought about is published rather than left out.
      # This job runs the harvest above and pushes on a schedule with no PR gate in
      # front of it, so the guard belongs here and not only in the PR checks. It reads
      # the repo and never opens a page (the browser is launched lazily), so it needs
      # no chromium — which is why it can sit in a deploy path that installs neither.
      - name: Guard the bundle (nothing unintended gets served)
        if: steps.cf.outputs.deploy == 'true'
        run: node tests/run.mjs shipping

      - name: Deploy to Cloudflare
        if: steps.cf.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
